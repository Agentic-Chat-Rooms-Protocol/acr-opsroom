name: Retort DoE Grid Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-retort-doe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run OpsRoom Core & Retort ANOVA Tests
        run: npm test
